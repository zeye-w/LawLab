name: V0.4 refresh lockfile (temporary)
on:
  push:
    branches: [feat/v0.4-cloudflare-ai-paper]
    paths:
      - package.json
permissions:
  contents: write
jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated package-lock.json
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json
            git commit -m "chore(v0.4): synchronize PDF.js and Wrangler dependency lock"
            git push origin HEAD:feat/v0.4-cloudflare-ai-paper
          fi
